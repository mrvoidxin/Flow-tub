name: Build APK

# Builds an installable debug APK on GitHub's runners and publishes it as a
# workflow artifact. This workflow needs no repository secrets, so it works on
# a plain mirror of the source tree.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build universal debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Show APK version
        run: |
          apk=app/build/outputs/apk/github/debug/app-github-universal-debug.apk
          test -f "$apk"
          ls -lh app/build/outputs/apk/github/debug/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: flow-debug-apks
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 30

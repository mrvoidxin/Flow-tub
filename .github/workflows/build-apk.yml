name: Build APK

# Builds three installable Flow Tube APKs (universal, arm64-v8a, armeabi-v7a)
# on GitHub's runners and publishes them as a workflow artifact and, for tags,
# as release assets. No repository secrets are required: when no release
# keystore is supplied the job generates a throwaway one so the APKs install.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provide a release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype JKS \
              -alias flowtube \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass flowtube -keypass flowtube \
              -dname "CN=Flow Tube, OU=Flow Tube, O=Flow Tube, L=, S=, C="
            echo "STORE_PASSWORD=flowtube" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flowtube" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=flowtube" >> "$GITHUB_ENV"
          fi

      - name: Build APKs (universal, arm64-v8a, armeabi-v7a)
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Collect and rename APKs
        run: |
          out=app/build/outputs/apk/github/release
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          for abi in universal arm64-v8a armeabi-v7a; do
            cp "$out/app-github-${abi}-release.apk" "dist/FlowTube-${version}-${abi}.apk"
          done
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
